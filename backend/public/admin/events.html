<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events | e_Touring</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admin-style.css">
    <style>
        .image-preview { margin-top: 10px; position: relative; display: inline-block; }
        .image-preview img { width: 150px; height: 120px; object-fit: cover; border-radius: 8px; border: 2px solid var(--admin-primary); }
        .image-preview .remove-image { position: absolute; top: -10px; right: -10px; background: #dc3545; color: white; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; border: none; }
        .upload-progress { display: none; margin-top: 10px; color: var(--admin-primary); }
        .table-image { width: 50px; height: 40px; object-fit: cover; border-radius: 5px; }
        textarea.form-control { min-height: 90px; resize: vertical; }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="logo"><i class="fas fa-tree"></i> e_Touring</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="events.html" class="active"><i class="fas fa-calendar-alt"></i> Events</a></li>
                <li><a href="plans.html"><i class="fas fa-map-marked-alt"></i> Plans</a></li>
                <li><a href="feedback.html"><i class="fas fa-comment-dots"></i> Feedback</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="section-header">
                <h2>Manage Events</h2>
                <button class="btn btn-primary" id="addEventBtn"><i class="fas fa-plus"></i> Add Event</button>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Location</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="eventsBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('eventModal')">&times;</span>
            <h3 id="modalTitle">Add Event</h3>
            <input type="hidden" id="eventId">

            <div class="form-group"><input type="text" id="eventTitle" placeholder="Title *" class="form-control" required></div>
            <div class="form-group"><input type="text" id="eventDate" placeholder="Date (e.g. May 16, 2026 or TBA)" class="form-control"></div>
            <div class="form-group"><input type="text" id="eventTime" placeholder="Time (e.g. 10:30 AM or TBA)" class="form-control"></div>
            <div class="form-group"><input type="text" id="eventLocation" placeholder="Location" class="form-control"></div>
            <div class="form-group"><textarea id="eventDescription" placeholder="Description" class="form-control"></textarea></div>

            <div class="form-group"><input type="text" id="eventPrice" placeholder="Price" class="form-control"></div>
            <div class="form-group"><input type="text" id="eventSpotsLeft" placeholder="Spots Left" class="form-control"></div>
            <div class="form-group"><select id="eventDifficulty" class="form-control">
                    <option value="">Difficulty (optional)</option>
                    <option>Easy</option>
                    <option>Moderate</option>
                    <option>Difficult</option>
                </select></div>
            <div class="form-group"><input type="text" id="eventCategory" placeholder="Category" class="form-control"></div>
            <div class="form-group"><input type="text" id="eventBadge" placeholder="Badge (optional)" class="form-control"></div>

            <div class="form-group">
                <input type="file" id="eventImageFile" accept="image/*" class="form-control">
                <div class="upload-progress" id="uploadProgress"><i class="fas fa-spinner fa-pulse"></i> Uploading...</div>
                <div id="imagePreview" class="image-preview"></div>
                <input type="hidden" id="eventImage">
            </div>

            <button class="btn btn-primary" onclick="saveEvent()">Save Event</button>
        </div>
    </div>

    <script>
        const API_URL = localStorage.getItem('API_BASE_URL') || 'https://e-touring-vdye.onrender.com';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';

        let allEvents = [];

        function resolveImageUrl(url) {
            if (!url) return '';
            if (/^https?:\/\//i.test(url)) return url;
            if (url.startsWith('/')) return `${API_URL}${url}`;
            return url;
        }

        function parseEventDateMs(dateStr) {
            if (!dateStr) return Number.POSITIVE_INFINITY;
            const s = String(dateStr).trim();
            if (!s || /^tba$/i.test(s)) return Number.POSITIVE_INFINITY;
            const ms = Date.parse(s);
            return Number.isFinite(ms) ? ms : Number.POSITIVE_INFINITY;
        }

        function parseEventTimeMinutes(timeStr) {
            if (!timeStr) return Number.POSITIVE_INFINITY;
            const s = String(timeStr).trim();
            if (!s || /^tba$/i.test(s)) return Number.POSITIVE_INFINITY;
            const m12 = s.match(/^\s*(\d{1,2})(?::(\d{2}))?\s*([AaPp][Mm])\s*$/);
            if (m12) {
                let h = parseInt(m12[1], 10);
                const min = m12[2] ? parseInt(m12[2], 10) : 0;
                const ampm = m12[3].toUpperCase();
                if (h === 12) h = 0;
                if (ampm === 'PM') h += 12;
                return h * 60 + min;
            }
            const m24 = s.match(/^\s*(\d{1,2}):(\d{2})\s*$/);
            if (m24) return parseInt(m24[1], 10) * 60 + parseInt(m24[2], 10);
            return Number.POSITIVE_INFINITY;
        }

        function sortEventsInPlace(list) {
            list.sort((a, b) => {
                const da = parseEventDateMs(a.date);
                const db = parseEventDateMs(b.date);
                if (da !== db) return da - db;
                const ta = parseEventTimeMinutes(a.time);
                const tb = parseEventTimeMinutes(b.time);
                if (ta !== tb) return ta - tb;
                return String(a.title || '').localeCompare(String(b.title || ''), undefined, { sensitivity: 'base' });
            });
        }

        function renderEvents() {
            sortEventsInPlace(allEvents);
            document.getElementById('eventsBody').innerHTML = allEvents.map(e => `
                <tr>
                    <td>${e.image ? `<img src="${resolveImageUrl(e.image)}" class="table-image">` : '-'}</td>
                    <td>${escapeHtml(e.title)}</td>
                    <td>${escapeHtml(e.date || 'TBA')}</td>
                    <td>${escapeHtml(e.time || 'TBA')}</td>
                    <td>${escapeHtml(e.location || '-')}</td>
                    <td>
                        <button class="btn btn-warning" onclick="editEvent('${e._id}')">Edit</button>
                        <button class="btn btn-danger" onclick="deleteEvent('${e._id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadEvents() {
            const res = await fetch(`${API_URL}/api/events`);
            if (res.status === 401) { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; return; }
            allEvents = await res.json();
            if (!Array.isArray(allEvents)) allEvents = [];
            renderEvents();
        }

        async function deleteEvent(id) {
            if (!confirm('Delete?')) return;
            const res = await fetch(`${API_URL}/api/events/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            if (res.status === 401) { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; return; }
            loadEvents();
        }

        function editEvent(id) {
            const e = allEvents.find(x => x._id === id);
            if (!e) return;

            document.getElementById('eventId').value = e._id;
            document.getElementById('eventTitle').value = e.title || '';
            document.getElementById('eventDate').value = e.date || '';
            document.getElementById('eventTime').value = e.time || '';
            document.getElementById('eventLocation').value = e.location || '';
            document.getElementById('eventDescription').value = e.description || '';
            document.getElementById('eventPrice').value = e.price || '';
            document.getElementById('eventSpotsLeft').value = e.spotsLeft || '';
            document.getElementById('eventDifficulty').value = e.difficulty || '';
            document.getElementById('eventCategory').value = e.category || '';
            document.getElementById('eventBadge').value = e.badge || '';

            document.getElementById('eventImage').value = e.image || '';
            showImagePreview(e.image || '');

            document.getElementById('modalTitle').innerText = 'Edit Event';
            document.getElementById('eventModal').style.display = 'flex';
        }

        function showImagePreview(url) {
            const resolved = resolveImageUrl(url);
            document.getElementById('imagePreview').innerHTML = resolved
                ? `<img src="${resolved}"><button class="remove-image" type="button" onclick="removeImage()">✕</button>`
                : '';
        }

        function removeImage() {
            document.getElementById('eventImage').value = '';
            document.getElementById('imagePreview').innerHTML = '';
        }

        document.getElementById('eventImageFile').addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) { alert('Select image'); return; }
            const formData = new FormData();
            formData.append('image', file);
            document.getElementById('uploadProgress').style.display = 'block';
            try {
                const res = await fetch(`${API_URL}/api/upload/event`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData });
                if (res.status === 401) { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; return; }
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('eventImage').value = data.imageUrl;
                    showImagePreview(data.imageUrl);
                } else {
                    alert(data.message || 'Upload failed');
                }
            } catch (err) {
                alert('Upload error');
            } finally {
                document.getElementById('uploadProgress').style.display = 'none';
            }
        });

        async function saveEvent() {
            const id = document.getElementById('eventId').value;
            const payload = {
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                time: document.getElementById('eventTime').value,
                location: document.getElementById('eventLocation').value,
                description: document.getElementById('eventDescription').value,
                price: document.getElementById('eventPrice').value,
                spotsLeft: document.getElementById('eventSpotsLeft').value,
                difficulty: document.getElementById('eventDifficulty').value,
                category: document.getElementById('eventCategory').value,
                badge: document.getElementById('eventBadge').value,
                image: document.getElementById('eventImage').value
            };

            if (!payload.title || !payload.title.trim()) {
                alert('Title is required');
                return;
            }

            const url = id ? `${API_URL}/api/events/${id}` : `${API_URL}/api/events`;
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(payload) });
            if (res.status === 401) { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; return; }
            if (res.ok) {
                closeModal('eventModal');
                await loadEvents();
                alert('Saved');
            } else {
                let msg = 'Error saving event';
                try { const data = await res.json(); msg = data.message || msg; } catch (_) {}
                alert(msg);
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

        document.getElementById('addEventBtn').onclick = () => {
            document.getElementById('eventId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventDescription').value = '';
            document.getElementById('eventPrice').value = '';
            document.getElementById('eventSpotsLeft').value = '';
            document.getElementById('eventDifficulty').value = '';
            document.getElementById('eventCategory').value = '';
            document.getElementById('eventBadge').value = '';
            removeImage();
            document.getElementById('modalTitle').innerText = 'Add Event';
            document.getElementById('eventModal').style.display = 'flex';
        };

        document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; };
        window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; };

        loadEvents();
    </script>
</body>

</html>
